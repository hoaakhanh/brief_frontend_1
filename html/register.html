<div class="register-modal hidden">
    <form class="register-form" novalidate>
        <h2>Register</h2>
        <input 
            type="text"
            id="register-username"
            placeholder="Username"
        >

        <p class="username-error"></p>

        <input
            type="email"
            id="register-email"
            placeholder="Email"
        >

        <p class="register-email-error"></p>

        <input
            type="password"
            id="register-password"
            placeholder="Password"
        >

        <p class="register-password-error"></p>

        <button type="submit">
            Register
        </button>

        <p>
            Đã có tài khoản?
            <a href="login.html" type="button" id="show-login-btn">
                Login
            </a>
        </p>

        <button type="button" class="register-close-btn">
            ×
        </button>

    </form>

</div>
