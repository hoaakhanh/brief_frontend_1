<!DOCTYPE html>
<html>
    <head>
        <title>AnimeVerse</title>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">

        <link rel="icon" type="image/png" href="../assets/logoicon.png">

        <link rel="stylesheet" href="../css/pages.css">
        <link rel="stylesheet" href="../css/responsive.css">
        <link rel="stylesheet" href="../css/style.css">
    </head>

    <body>
        <div class="container">
            <nav>
                <a class="logo">
                    <span>AnimeVerse</span>
                </a>

                <button class="menu-btn">
                    ☰
                </button>

                <ul class="nav-menu"> 
                    <li><a href="index.html">Home</a></li>
                </ul>
            </nav>
        </div>

        <div class="register-page">
            <form class="register-form" novalidate>
                <h2>Register</h2>
                <input 
                    type="text"
                    id="register-username"
                    placeholder="Username"
                >

                <p class="username-error"></p>

                <input
                    type="email"
                    id="register-email"
                    placeholder="Email"
                >

                <p class="register-email-error"></p>

                <input
                    type="password"
                    id="register-password"
                    placeholder="Password"
                >

                <p class="register-password-error"></p>

                <button type="submit">
                    Register
                </button>

                <p class="alert">
                    Đã có tài khoản?
                    <a href="login.html" type="button" id="show-login-btn">
                        Login
                    </a>
                </p>

            </form>

        </div>
    </body>
</html>
